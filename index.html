.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0}.grid>*{min-width:0}.report-date-grid input[type=date]{display:block;width:100%;min-width:0;max-width:100%;padding:10px 8px;font-size:clamp(12px,3.8vw,16px)}@media(max-width:420px){.report-date-grid{grid-template-columns:1fr}}

.dupb{background:#FFF0D6;color:#7A2330;border-radius:14px;padding:10px 14px;margin:0 0 10px;font-size:13px;font-weight:600}
.stm{--tx:#182533;--mu:#687586;--bd:#E1E5E9;--s2:#f3f4f6;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:30px 28px;overflow-x:auto;margin-top:16px;box-shadow:var(--sh)}

.stm.t1{background:#F5F1E8;border-color:#e4dcc9}.stm.t1 h2,.stm.t1 .close b{color:#102C46}.stm.t1 th{background:none;color:#102C46;border-top:2px solid #D6B77A;border-bottom:1px solid #102C46}.stm.t1 td{border-color:#e4dcc9}.stm.t1 .tot{border-top:2px solid #D6B77A}

async function flush(){if(!U||!online||flushing)return;flushing=true;let ls=[];try{ls=await q.all()}catch(e){}for(const it of ls){if(it.st==='conflict')continue;try{await commit(it);await q.del(it.id);toast('Hisaab cloud par sync ho gaya')}catch(e){it.st=e.message==='conflict'?'conflict':'fail';await q.put(it).catch(()=>{})}}flushing=false;try{P=await q.all()}catch(e){P=[]}refreshDataView()}
async function resolve(id,mine){const it=P.find(x=>x.id===id);if(mine){it.base=T[id]?.updatedAt||0;it.st='wait';await q.put(it);flush()}else{await q.del(id);P=await q.all();draw()}}
