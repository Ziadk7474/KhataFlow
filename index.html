const q={db:null,open(){return this.db||(this.db=new Promise((ok,no)=>{const r=indexedDB.open('khata',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},

let P=[],flushing=false;
async function loadP(){try{P=await q.all()}catch(e){P=[]}draw();flush()}
async function flush(){if(!U||!online||flushing)return;flushing=true;let ls=[];try{ls=await q.all()}catch(e){}for(const it of ls){if(it.st==='conflict')continue;try{await commit(it);await q.del(it.id);toast('Hisaab cloud par sync ho gaya')}catch(e){it.st=e.message==='conflict'?'conflict':'fail';await q.put(it).catch(()=>{})}}flushing=false;try{P=await q.all()}catch(e){P=[]}draw()}

// ---- WhatsApp (premium bilingual action) ----
let SM={id:'',t:null,lang:'roman'};
function msg(id,t,lang='roman'){return dmy(t.date)+'\n'+msg0(id,t,lang)}
function msg0(id,t,lang){const c=C[t.customerId],now=bal(t.customerId),prev=now-eff(t),n=c.name,A=fmt(t.amountFils),d=t.desc||'Maal',advance=Math.max(0,-now),remaining=Math.max(0,now);
 if(lang==='urdu')return t.type==='paisay'?`السلام علیکم ${n} صاحب،\n\nآپ کی طرف سے ${A} کی رقم وصول ہو گئی ہے۔\n\nپہلا بقایا: ${fmt(prev)}\nوصول شدہ رقم: ${A}\n${advance?`آپ کے کھاتے میں اضافی رقم: ${fmt(advance)}`:`آپ کا باقی بقایا: ${fmt(remaining)}`}\n\nآپ کی ادائیگی کا بہت شکریہ!`:`السلام علیکم ${n} صاحب،\n\nآج کا مال: ${d} — ${A}\nپہلا بقایا: ${fmt(prev)}\nآپ کا کل بقایا: ${fmt(now)}\n\nمہربانی فرما کر اپنا حساب چیک کر لیں۔\nشکریہ!`;
 return t.type==='paisay'?`Assalam-o-Alaikum ${n} Sahib,\n\nAap ki taraf se ${A} ki raqam wasool ho gayi hai.\n\nPehla baqaya: ${fmt(prev)}\nWasool shuda raqam: ${A}\n${advance?`Aap ka advance baqaya: ${fmt(advance)}`:`Aap ka baqi baqaya: ${fmt(remaining)}`}\n\nAap ki payment ka bohat shukriya!`:`Assalam-o-Alaikum ${n} Sahib,\n\nAaj ka maal: ${d} — ${A}\nPehla baqaya: ${fmt(prev)}\nAap ka kul baqaya: ${fmt(now)}\n\nMeherbani, apna hisaab check kar lein.\nShukriya!`}
function renderShare(){const m=msg(SM.id,SM.t,SM.lang);$('#wm').value=m;$('#wm').className=SM.lang==='urdu'?'urdu':'';$('#mr').className=SM.lang==='roman'?'on':'';$('#mu').className=SM.lang==='urdu'?'on':''}
function share(id,t){SM={id,t,lang:'roman'};$('#dlg').innerHTML=`<button aria-label="Close" style="position:absolute;right:14px;top:12px;border:0;background:none;font-size:22px;padding:4px" onclick="$('#dlg').close()">×</button><h3>Hisaab Mehfooz Ho Gaya</h3><p class="mut">Customer ke liye paighaam ki zubaan chunein.</p><div class="seg"><button id="mr" class="on" onclick="SM.lang='roman';renderShare()">Roman English</button><button id="mu" onclick="SM.lang='urdu';renderShare()">Urdu</button></div><textarea rows="8" id="wm" readonly>${esc(msg(id,t))}</textarea><div class="btns"><button class="g" onclick="wa('${t.customerId}')">WhatsApp Bhejein</button></div>`;$('#dlg').showModal()}
function wa(cid,text){const p=(C[cid].phone||'').replace(/\D/g,'');if(!p){const m=text||$('#wm').value;if(navigator.share)navigator.share({text:m}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(m).then(()=>toast('Is customer ka number nahi hai. Paighaam copy ho gaya.'));else toast('Is customer ka number nahi hai.');return}const w=window.open('https://wa.me/'+p+'?text='+encodeURIComponent(text||$('#wm').value),'_blank');if(!w)toast('WhatsApp kholne mein masla hua.')}
// ---- Reports ----
let R={shown:0,cid:'',cq:'',p:'m',from:'',to:'',ty:'',tp:''},last='';
function rng(){const d=new Date(today()),y=d.getFullYear(),m=d.getMonth(),z=x=>x.toLocaleDateString('en-CA'),M=(a,b)=>[z(new Date(a,b,1)),z(new Date(a,b+1,0))],v=R.p;let r=['',''];
 if(v==='t')r=[today(),today()];if(v==='m')r=M(y,m);if(v==='pm')r=M(y,m-1);if(v==='y')r=[y+'-01-01',y+'-12-31'];if(v==='w'){const s=new Date(d);s.setDate(d.getDate()-d.getDay());r=[z(s),today()]}if(v!=='c'){R.from=r[0];R.to=r[1]}}
const sel=(k,o)=>`<select onchange="R.shown=0;R.${k}=this.value;${k==='p'?'rng();':''}draw()">${o.map(([v,l])=>`<option value="${v}" ${R[k]===v?'selected':''}>${l}</option>`).join('')}</select>`;
function rep(){if(FM.rc){R.cid=FM.rc;FM.rc=null;R.shown=1}R.tp=R.tp||S.tpl||'t1';if(!R.from&&R.p!=='c')rng();
 return `${BK}<h2>Hisaab Reports</h2><div class="card noprint"><label for="rc-search">Customer</label><div class="customer-picker"><input id="rc-search" type="search" autocomplete="off" placeholder="Sab Customers — naam ya number se dhoondein" value="${esc(R.cid&&C[R.cid]?C[R.cid].name:'')}" onfocus="this.select();R.cq='';document.getElementById('rc-options').hidden=false;filterOpts('rc-options','')" oninput="R.cq=this.value;document.getElementById('rc-options').hidden=false;filterOpts('rc-options',R.cq)"><div id="rc-options" class="customer-options" role="listbox" aria-label="Customers" hidden><button type="button" class="customer-option" role="option" data-search="sab all customers" onclick="repPick('')"><span>Sab Customers</span></button>${custs().map(c=>`<button type="button" class="customer-option" role="option" data-search="${esc(((c.name||'')+' '+(c.phone||'')).toLowerCase())}" onclick="repPick('${c.id}')"><span>${esc(c.name)}</span><small>${esc(c.phone||'')}</small></button>`).join('')}</div></div><label>Muddat</label>${sel('p',[['m','Is Mahine'],['t','Aaj'],['w','Is Hafte'],['pm','Pichla Mahina'],['y','Is Saal'],['a','Poori History'],['c','Apni Tareekh Chunein']])}
 <div class="grid"><div><label>Se</label><input type="date" value="${R.from}" onchange="R.shown=0;R.from=this.value;R.p='c';draw()"></div><div><label>Tak</label><input type="date" value="${R.to}" onchange="R.shown=0;R.to=this.value;R.p='c';draw()"></div></div><label>Qisam</label>${sel('ty',[['','Sab'],['udhaar','Udhaar Diya'],['paisay','Paisay Milay']])}<label>Template</label>${sel('tp',[['t1','Premium Khata'],['t2','Simple Ledger'],['t3','Modern Business']])}
 <div class="btns"><button class="p" onclick="repSearch()">Record Dhoondein</button><button onclick="repPrint()">Print Karein</button><button class="g" onclick="repWa()">WhatsApp Par Bhejein</button></div></div><div id="out"></div>`}
function runRep(){const{cid,from,to,ty,tp}=R,cs=cid?[cid]:Object.keys(C),c=C[cid],L=live().filter(t=>cs.includes(t.customerId)&&C[t.customerId]).sort(sortT);
 const open=cs.reduce((s,i)=>s+(C[i]?.openingFils||0),0)+L.filter(t=>from&&t.date<from).reduce((s,t)=>s+eff(t),0);
 const inR=L.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to));let r=open;
 const rows=inR.map(t=>{r+=eff(t);if(ty&&t.type!==ty)return '';return `<tr><td>${dmy(t.date)}</td><td>${cid?'':esc(C[t.customerId].name)+' — '}${esc(txnLabel(t))}</td><td class="n">${t.type==='udhaar'?fmt(t.amountFils):''}</td><td class="n">${t.type==='paisay'?fmt(t.amountFils):''}</td><td class="n">${fmt(r)}</td></tr>`}).join('');
 const X=inR.filter(t=>!ty||t.type===ty),cr=X.filter(t=>t.type==='udhaar').reduce((s,t)=>s+t.amountFils,0),pd=X.filter(t=>t.type==='paisay').reduce((s,t)=>s+t.amountFils,0);
 last=`${S.name||'Hisaab'} — Statement${c?' '+c.name:''}\nMuddat: ${from?dmy(from):'shuru'} se ${to?dmy(to):'aaj'}\nPehle ka Baqaya: ${fmt(open)}\nUdhaar: ${fmt(cr)}\nPaisay Milay: ${fmt(pd)}\nKul Baqaya: ${fmt(r)}`;
 $('#out').innerHTML=`<div class="stm ${tp}" id="stm">${S.logo?`<img src="${S.logo}" style="height:48px"><br>`:''}<h2>${esc(S.name||'KhataFlow')}</h2><div class="mut">${esc(S.phone||'')}</div><h3>${c?esc(c.name)+(c.phone?' · '+esc(c.phone):''):'Poori Business Report'}</h3><div class="mut">Statement #${(cid||'ALL').slice(-5).toUpperCase()}-${today().replace(/-/g,'')} · Muddat: ${from?dmy(from):'shuru'} se ${to?dmy(to):'aaj'}</div>
 <p class="mut">Udhaar = customer par baqaya barhta hai. Paisay Milay = baqaya kam hota hai.${ty?' (Qisam filter laga hai, Baqaya poori history ka hai.)':''}</p><table><thead><tr><th>Tareekh</th><th>Tafseel</th><th class="n">Udhaar</th><th class="n">Paisay</th><th class="n">Baqaya</th></tr></thead><tbody><tr><td></td><td><i>Pehle ka Baqaya</i></td><td></td><td></td><td class="n">${fmt(open)}</td></tr>${rows||'<tr><td colspan="5">Is muddat mein koi hisaab nahi.</td></tr>'}</tbody></table>
 <div class="tot"><div>Kul Udhaar ${fmt(cr)} · Paisay Milay ${fmt(pd)}</div><div class="close"><span>Closing Baqaya</span><b>${fmt(r)}</b></div></div><p class="mut">Banaya gaya: ${dmy(today())}. Agar hisaab mein tabdeeli ho to naya statement banayein.</p></div>`}
function repSearch(){R.shown=1;runRep();$('#out').scrollIntoView({behavior:'smooth',block:'start'})}
function repPrint(){R.shown=1;runRep();setTimeout(()=>window.print(),150)}
function repWa(){if(!R.cid)return toast('WhatsApp ke liye customer chunein');R.shown=1;runRep();wa(R.cid,last)}
const lib=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function outf(kind,sh){try{runRep();if(!window.html2canvas)await lib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
 const cv=await html2canvas($('#stm'),{scale:2,backgroundColor:'#fff'}),nm='statement-'+(C[R.cid]?.name||'sab').replace(/\W+/g,'-')+'-'+today();let blob,name;
 if(kind==='png'){blob=await new Promise(r=>cv.toBlob(r));name=nm+'.png'}else{if(!window.jspdf)await lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const pdf=new jspdf.jsPDF('p','mm','a4'),W=190,H=cv.height*W/cv.width,PH=275;for(let y=0;y<H;y+=PH){const hh=Math.min(PH,H-y),pc=document.createElement('canvas');pc.width=cv.width;pc.height=Math.round(hh*cv.width/W);pc.getContext('2d').drawImage(cv,0,Math.round(y*cv.width/W),cv.width,pc.height,0,0,cv.width,pc.height);if(y)pdf.addPage();pdf.addImage(pc.toDataURL('image/png'),'PNG',10,10,W,hh)}
  blob=pdf.output('blob');name=nm+'.pdf'}
 const f=new File([blob],name,{type:blob.type});
 if(sh&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name})}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();toast(sh?'Is browser mein file share nahi hoti. File download ho gayi.':'Statement tayyar ho gaya')}
}catch(e){if(e.name!=='AbortError')toast('PDF download nahi ho saki. Dobara koshish karein.')}}
// ---- Settings ----
function set(){return `${BK}<h2>App ki Settings</h2><div class="card"><label>Logo</label><input type="file" accept="image/*" onchange="logo(this)"><label>Business ka Naam</label><input id="sn" value="${esc(S.name)}"><label>Business Phone</label><input id="sp" value="${esc(S.phone)}"><label>Default Country Code</label><input id="sc" value="${esc(S.cc)}"><label>Default Template</label><select id="st"><option value="t1">Premium Khata</option><option value="t2" ${S.tpl==='t2'?'selected':''}>Simple Ledger</option><option value="t3" ${S.tpl==='t3'?'selected':''}>Modern Business</option></select>
 <p class="mut" style="margin-top:14px">WhatsApp paighaam har hisaab save hone ke baad Roman English ya Urdu mein tayyar hota hai.</p><button class="p" onclick="saveS()">Mehfooz Karein</button></div><div class="btns"><button onclick="inst()">App Install Karein</button><button onclick="backup()">Backup Download Karein</button><button onclick="$('#rf2').click()">Backup Wapas Lagayein</button><input id="rf2" type="file" accept=".json" hidden onchange="restore(this)"></div>`}
async function saveS(){try{await B.child('settings').set({name:$('#sn').value,phone:$('#sp').value,cc:$('#sc').value.replace(/\D/g,'')||'971',tpl:$('#st').value,msg:S.msg||'',logo:S.logo||'',shortcuts:S.shortcuts||[]});toast('Settings mehfooz ho gayin')}catch(e){toast('Mehfooz nahi hua.')}}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({customers:C,transactions:T,settings:S},null,1)],{type:'application/json'}));a.download='khata-backup-'+today()+'.json';a.click()}
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.customers!=='object'||typeof d.transactions!=='object')throw 0;ask('Maujooda data hat kar is backup se badal dein?','Haan, Wapas Lagayein',async()=>{if(cloud){try{await B.update({customers:d.customers||{},transactions:d.transactions||{},settings:d.settings||{}});toast('Backup wapas lag gaya')}catch(e){toast('Backup nahi laga. Dobara koshish karein.')}}else{localStorage.setItem('khataLocal',JSON.stringify({businesses:{demo:{customers:d.customers||{},transactions:d.transactions||{},settings:d.settings||{}}}}));location.reload()}})}catch(e){toast('Yeh backup file durust nahi hai')}};r.readAsText(f)}
let ip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
const inst=()=>ip?ip.prompt():toast('Browser menu mein "Add to Home screen" chunein');
function logo(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,240/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');toast('Logo chun liya. Mehfooz Karein dabayein.')};im.onerror=()=>toast('Yeh tasveer nahi khuli');im.src=URL.createObjectURL(f)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(typeof firebase!=='undefined'&&firebase.initializeApp&&!firebaseConfig.apiKey.includes('PASTE'))firebaseMode();
else{localMode();setNet();toast('Firebase Web API key abhi placeholder hai; data filhaal sirf is phone mein rahega.')}
</script></body></html>
